[project]
name = "cafe-companion"
version = "0.1.0"
description = ""
authors = [
    {name = "vaibhavsinghtaurus2",email = "vaibhav.singh@thinktaurus.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2)",
    "pg8000 (>=1.31.6,<2.0.0)",
    "cloud-sql-python-connector[pg8000] (>=1.23.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "google-genai (>=2.34.0,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "cafe_companion", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
